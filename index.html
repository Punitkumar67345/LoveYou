<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Heart</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #060208;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    canvas {
      display: block;
      max-width: 95vw;
      max-height: 95vh;
    }
  </style>
</head>
<body>
<canvas id="heartCanvas" width="1000" height="1000"></canvas>

<script>
const canvas = document.getElementById("heartCanvas");
const ctx = canvas.getContext("2d");

// --- Configuration (Size Bada + Speed Slow) ---
const SC = 27;        // Heart ka overall scale (pehle 21 tha, ab bada hoga)
const OY = 25;        // Vertical offset center alignment ke liye
const DURATION = 42;  // Poora heart draw hone ka time (seconds me) - Slow & Romantic
const ANIM = 95;      // Har text ke drop aur settle hone ke frames - Very smooth
const LIFT = 38;      // Girne ki height
const GAP = 8;        // Words ke beech ka gap
const SIZES = [11, 12, 13, 14]; // Text font sizes thode bade kiye hain
const FONT = "Arial";
const BG = "#060208";
const BGC = [6 / 255, 2 / 255, 8 / 255];
const FLASH = [1.0, 0.78, 0.78];

const PHRASES = [
  "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
  "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
  "사랑해", "愛してる", "我爱你", "मैं तुमसे प्यार करता हूँ",
  "Σ' αγαπώ", "Ik hou van jou", "Jag älskar dig", "Kocham cię",
  "ฉันรักเธอ", "Anh yêu em", "Aku cinta kamu", "Я тебе кохаю"
];

function heartPoint(a) {
  const x = 16 * Math.pow(Math.sin(a), 3);
  const y = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
  return [x * SC, y * SC + OY];
}

const POLY = [];
for (let i = 0; i < 720; i++) {
  POLY.push(heartPoint((2 * Math.PI * i) / 720));
}

const EDGES = [];
for (let i = 0; i < POLY.length; i++) {
  EDGES.push([POLY[i], POLY[(i + 1) % POLY.length]]);
}

const YMAX = Math.max(...POLY.map(p => p[1]));
const YMIN = Math.min(...POLY.map(p => p[1]));
const CY = (YMAX + YMIN) / 2;

function spans(y) {
  const xs = [];
  for (const [[x1, y1], [x2, y2]] of EDGES) {
    if ((y1 <= y && y < y2) || (y2 <= y && y < y1)) {
      xs.push(x1 + ((y - y1) * (x2 - x1)) / (y2 - y1));
    }
  }
  xs.sort((a, b) => a - b);
  const pairs = [];
  for (let i = 0; i < xs.length; i += 2) {
    if (i + 1 < xs.length) pairs.push([xs[i], xs[i + 1]]);
  }
  return pairs;
}

function intersect(A, B) {
  const out = [];
  for (const a of A) {
    for (const b of B) {
      const lo = Math.max(a[0], b[0]);
      const hi = Math.min(a[1], b[1]);
      if (hi - lo > 16) out.push([lo, hi]);
    }
  }
  return out;
}

function mix(a, b, k) {
  return [
    a[0] + (b[0] - a[0]) * k,
    a[1] + (b[1] - a[1]) * k,
    a[2] + (b[2] - a[2]) * k
  ];
}

function dim(c, k) {
  return [c[0] * k, c[1] * k, c[2] * k];
}

function hx(c) {
  const r = Math.round(Math.min(1, Math.max(0, c[0])) * 255);
  const g = Math.round(Math.min(1, Math.max(0, c[1])) * 255);
  const b = Math.round(Math.min(1, Math.max(0, c[2])) * 255);
  return `rgb(${r},${g},${b})`;
}

function mathDist(x, y) {
  return Math.hypot(x / (16 * SC), (y - CY) / (14.5 * SC));
}

let phrasePool = [...PHRASES];
function nextPhrase() {
  if (phrasePool.length === 0) phrasePool = [...PHRASES];
  const idx = Math.floor(Math.random() * phrasePool.length);
  return phrasePool.splice(idx, 1)[0];
}

function build() {
  const rowH = 21; // row spacing for larger font
  const half = rowH / 2;
  const placed = [];

  let y = YMAX - half;
  while (y > YMIN + half) {
    const row = intersect(spans(y + half), spans(y - half));
    for (let [lo, hi] of row) {
      lo += 4;
      hi -= 4;
      let cur = lo + Math.random() * 8;
      const line = [];

      while (true) {
        let fit = null;
        for (let tries = 0; tries < 10; tries++) {
          const text = nextPhrase();
          const size = SIZES[Math.floor(Math.random() * SIZES.length)];
          ctx.font = `bold ${size}px ${FONT}`;
          const w = ctx.measureText(text).width;
          if (cur + w <= hi) {
            fit = { text, size, w };
            break;
          }
        }
        if (!fit) break;
        line.push({ x: cur + fit.w / 2, text: fit.text, size: fit.size, w: fit.w });
        cur += fit.w + GAP;
      }

      if (line.length === 0) continue;
      if (line.length > 1) {
        const left = hi - (line[line.length - 1].x + line[line.length - 1].w / 2);
        for (let i = 0; i < line.length; i++) {
          line[i].x += (left * i) / (line.length - 1);
        }
      } else {
        line[0].x = (lo + hi) / 2;
      }

      for (let i = 0; i < line.length; i++) {
        const edge = i === 0 || i === line.length - 1;
        placed.push({ x: line[i].x, y: y, text: line[i].text, size: line[i].size, edge: edge });
      }
    }
    y -= rowH;
  }

  const wine = [0.58, 0.0, 0.09];
  const crimson = [0.90, 0.05, 0.14];
  const blood = [0.98, 0.10, 0.16];

  for (const p of placed) {
    const rad = Math.min(1.0, mathDist(p.x, p.y));
    let base = mix(wine, crimson, 0.25 + 0.75 * rad);
    base = mix(base, blood, Math.random() * 0.35 + (p.edge ? 0.3 : 0));
    p.color = base.map(v => Math.min(1, v));
    p.rad = rad;
  }

  const edges = placed.filter(p => p.edge);
  const inner = placed.filter(p => !p.edge);
  edges.sort((a, b) => Math.atan2(a.x, a.y - CY) - Math.atan2(b.x, b.y - CY));
  inner.sort((a, b) => -a.rad + Math.random() * 0.08 - (-b.rad + Math.random() * 0.08));
  return [...edges, ...inner];
}

const ORDER = build();
const active = [];
let spawnedCount = 0;
const RATE = ORDER.length / ((DURATION * 1000) / 16);
let acc = 0;
let finishedSpawning = false;

function spawn(p) {
  p.f = 0;
  p.dx = (Math.random() - 0.5) * 16;
  p.shimmerFlash = 0;
  active.push(p);
}

function frame() {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  // Centering on 1000x1000 canvas
  ctx.translate(500, 500);

  if (!finishedSpawning) {
    acc += RATE;
    while (acc >= 1 && spawnedCount < ORDER.length) {
      acc -= 1;
      spawn(ORDER[spawnedCount]);
      spawnedCount++;
    }
    if (spawnedCount >= ORDER.length) finishedSpawning = true;
  }

  for (const p of active) {
    if (p.f < ANIM) p.f++;
    const u = Math.min(1.0, p.f / ANIM);
    const e = 1 - Math.pow(1 - u, 3);
    const hover = (1 - e) * LIFT;
    const px = p.x + p.dx * (1 - e);
    const py = -p.y - hover;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    // Soft Shadow
    ctx.font = `bold ${p.size}px ${FONT}`;
    ctx.fillStyle = hx(mix(BGC, dim(p.color, 0.30), e));
    ctx.fillText(p.text, px + 2, py + 3);

    // Glow Halo
    ctx.font = `bold ${p.size + 1}px ${FONT}`;
    ctx.fillStyle = hx(mix(BGC, dim(p.color, 0.20), e * e));
    ctx.fillText(p.text, px, py);

    // Main Text
    const flash = 0.75 * Math.sin(Math.PI * Math.max(0, Math.min(1, (u - 0.55) / 0.45)));
    let col = mix(mix(BGC, p.color, Math.pow(e, 1.5)), FLASH, flash);
    if (p.shimmerFlash > 0) {
      col = mix(col, FLASH, p.shimmerFlash);
      p.shimmerFlash = Math.max(0, p.shimmerFlash - 0.03);
    }
    ctx.font = `bold ${p.size}px ${FONT}`;
    ctx.fillStyle = hx(col);
    ctx.fillText(p.text, px, py);
  }

  ctx.restore();
  requestAnimationFrame(frame);
}

// Gentle continuous shimmer after completing
setInterval(() => {
  if (finishedSpawning && active.length > 0) {
    const p = active[Math.floor(Math.random() * active.length)];
    p.shimmerFlash = 0.65;
  }
}, 160);

requestAnimationFrame(frame);
</script>
</body>
</html>
